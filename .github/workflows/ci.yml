name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: "Smoke: run / check / compile"
        shell: bash
        run: |
          ./target/release/evol run samples/demo_counter.evol boot | grep "n = 5"
          ./target/release/evol check samples/tc_ok.evol | grep "ошибок нет"
          ./target/release/evol compile samples/valid1_dispatcher.evol -o /tmp/valid1.py
          python3 /tmp/valid1.py
